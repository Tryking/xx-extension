name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: python3 package.py
      - uses: actions/upload-artifact@v4
        with:
          name: xx-extension
          path: dist/xx-extension-0.1.0.zip
