<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XX · Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo">XX</div>
        <div>
          <h1>XX <span data-i18n="title"></span></h1>
          <p data-i18n="subtitle"></p>
        </div>
      </header>
      <section class="card">
        <div class="section-top">
          <div>
            <h2 data-i18n="account"></h2>
            <p data-i18n="description"></p>
          </div>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
        <label class="row master"
          ><span data-i18n="enabled"></span
          ><input id="enabled" type="checkbox" role="switch" /></label
        ><label class="row"
          ><span data-i18n="followers"></span
          ><input id="followers" type="checkbox" role="switch" /></label
        ><label class="row"
          ><span data-i18n="following"></span
          ><input id="following" type="checkbox" role="switch" /></label
        ><label class="row"
          ><span data-i18n="relationship"></span
          ><input id="relationship" type="checkbox" role="switch" /></label
        ><label class="row"
          ><span data-i18n="position"></span
          ><select id="position">
            <option value="below" data-i18n="below"></option>
            <option value="inline" data-i18n="inline"></option></select></label
        ><label class="row"
          ><span data-i18n="numberFormat"></span
          ><select id="numberFormat">
            <option value="compact" data-i18n="compact"></option>
            <option value="full" data-i18n="full"></option></select></label
        ><label class="row"
          ><span data-i18n="language"></span
          ><select id="language">
            <option value="auto" data-i18n="auto"></option>
            <option value="zh_CN">简体中文</option>
            <option value="en">English</option>
          </select></label
        >
      </section>
      <section class="card preview">
        <small data-i18n="preview"></small>
        <div class="tweet">
          <div class="avatar">A</div>
          <div>
            <strong>Alex Chen</strong>
            <span class="handle">@alexchen · 2h</span>
            <div id="preview-badge"></div>
            <p>A little extra makes all the difference.</p>
          </div>
        </div>
      </section>
      <footer>
        <p data-i18n="privacy"></p>
        <p data-i18n="missing"></p>
      </footer>
    </main>
    <script src="shared/i18n.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
